# Role B — first full training run (stage 10).
#
# Requires:
#   cache built with targets:
#     python -m scripts.preprocess --subject-list splits/train_ids.txt --with-targets
#     python -m scripts.preprocess --subject-list splits/val_ids.txt   --with-targets
#   Role C's template:
#     python -m scripts.build_canonical_template --cache_dir cache
#
# Target to beat (EXPERIMENTS.md): B1 shared canonical template, val mean 5.5373 mm.

mode: cache
cache_dir: cache
split_file: configs/split_seed42.json
template_file: outputs/role_c/canonical_template_shared.npz
template_version: B1-shared-canonical
limit_train_ears: 0        # 0 = use all 320 training ears
n_points: 2048

in_dim: 3                  # real scans carry no normals; 6 is not available
n_landmarks: 85
point_dim1: 64
point_dim2: 128
point_dim3: 256
head_dim1: 512
head_dim2: 256
dropout: 0.3               # 320 ears vs ~570k params: overfitting is the main risk

epochs: 300
batch_size: 16
lr: 0.001
weight_decay: 0.0001
loss: smooth_l1
beta: 0.05

seed: 0
out_dir: outputs/role_b
run_name: baseline_seed0
num_workers: 0
